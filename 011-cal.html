<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calculator</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;background:#0a0a0a;padding:16px}
.calc{background:#141414;border-radius:24px;padding:24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.05)}
.display{margin-bottom:20px}
.display input{width:100%;background:#0a0a0a;border:1px solid #222;border-radius:16px;padding:20px 24px;font-size:2rem;font-weight:500;color:#fff;text-align:right;outline:none;transition:border-color .2s}
.display input:focus{border-color:#6c63ff}
.display .expr{color:#888;font-size:.85rem;text-align:right;padding:4px 8px 0 0;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn{border:none;border-radius:14px;padding:18px 0;font-size:1.3rem;font-weight:500;cursor:pointer;transition:all .15s;background:#1e1e1e;color:#fff;user-select:none}
.btn:hover{filter:brightness(1.3)}
.btn:active{transform:scale(.94)}
.btn-op{background:#2a2a3a;color:#6c63ff}
.btn-eq{background:#6c63ff;color:#fff}
.btn-clear{background:#3a1a1a;color:#ff5555}
.btn-zero{grid-column:span 2}
</style>
</head>
<body>

<div class="calc">
<div class="display">
  <div class="expr" id="expr"></div>
  <input type="text" id="display" readonly value="0">
</div>
<div class="buttons">
  <button class="btn btn-clear" data-action="clear">AC</button>
  <button class="btn btn-clear" data-action="sign">±</button>
  <button class="btn btn-clear" data-action="percent">%</button>
  <button class="btn btn-op" data-action="divide">÷</button>

  <button class="btn" data-value="7">7</button>
  <button class="btn" data-value="8">8</button>
  <button class="btn" data-value="9">9</button>
  <button class="btn btn-op" data-action="multiply">×</button>

  <button class="btn" data-value="4">4</button>
  <button class="btn" data-value="5">5</button>
  <button class="btn" data-value="6">6</button>
  <button class="btn btn-op" data-action="subtract">−</button>

  <button class="btn" data-value="1">1</button>
  <button class="btn" data-value="2">2</button>
  <button class="btn" data-value="3">3</button>
  <button class="btn btn-op" data-action="add">+</button>

  <button class="btn btn-zero" data-value="0">0</button>
  <button class="btn" data-value=".">.</button>
  <button class="btn btn-eq" data-action="calculate">=</button>
</div>
</div>

<script>
const display = document.getElementById('display');
const exprEl = document.getElementById('expr');
let state = { current: '0', previous: '', operation: null, reset: false, expression: '' };

function format(n) {
  const s = String(n).slice(0, 14);
  return s;
}

function updateDisplay() {
  display.value = format(state.current);
  exprEl.textContent = state.expression;
}

function inputDigit(d) {
  if (state.reset) { state.current = ''; state.reset = false; state.expression = ''; }
  if (d === '.' && state.current.includes('.')) return;
  if (state.current === '0' && d !== '.') state.current = d;
  else state.current += d;
  updateDisplay();
}

function operate(op) {
  const cur = parseFloat(state.current);
  if (state.previous !== '') {
    const prev = parseFloat(state.previous);
    state.current = String(compute(prev, cur, state.operation));
    state.current = format(state.current);
    state.expression = `${format(state.previous)} ${opSymbol(state.operation)} ${format(cur)} =`;
    state.previous = '';
  } else {
    state.expression = `${format(state.current)} ${opSymbol(op)}`;
  }
  state.operation = op;
  state.previous = state.current;
  state.reset = true;
  updateDisplay();
}

function compute(a, b, op) {
  switch (op) {
    case 'add': return a + b;
    case 'subtract': return a - b;
    case 'multiply': return a * b;
    case 'divide': return b !== 0 ? a / b : 'Error';
    default: return b;
  }
}

function opSymbol(op) {
  return { add: '+', subtract: '−', multiply: '×', divide: '÷' }[op] || '';
}

function calculate() {
  if (state.previous === '' || state.operation === null) return;
  const cur = parseFloat(state.current);
  const prev = parseFloat(state.previous);
  const result = compute(prev, cur, state.operation);
  state.expression = `${format(state.previous)} ${opSymbol(state.operation)} ${format(cur)} =`;
  state.current = String(result);
  state.previous = '';
  state.operation = null;
  state.reset = true;
  updateDisplay();
}

function clearAll() {
  state = { current: '0', previous: '', operation: null, reset: false, expression: '' };
  updateDisplay();
}

function toggleSign() {
  state.current = state.current !== '0' ? String(-parseFloat(state.current)) : '0';
  updateDisplay();
}

function percent() {
  state.current = String(parseFloat(state.current) / 100);
  updateDisplay();
}

document.querySelector('.buttons').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.value !== undefined) { inputDigit(btn.dataset.value); return; }
  const action = btn.dataset.action;
  if (action === 'clear') clearAll();
  else if (action === 'sign') toggleSign();
  else if (action === 'percent') percent();
  else if (action === 'calculate') calculate();
  else if (['add','subtract','multiply','divide'].includes(action)) operate(action);
});

document.addEventListener('keydown', e => {
  const keyMap = { '+':'add', '-':'subtract', '*':'multiply', '/':'divide', 'Enter':'calculate', '=':'calculate', 'Escape':'clear', 'Delete':'clear', '%':'percent' };
  if (/^[0-9.]$/.test(e.key)) { inputDigit(e.key); return; }
  const action = keyMap[e.key];
  if (!action) return;
  e.preventDefault();
  if (action === 'clear') clearAll();
  else if (action === 'percent') percent();
  else if (action === 'calculate') calculate();
  else operate(action);
});
</script>
</body>
</html>
